name: LeetCode Daily Monitor

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '30 14 * * *'   # UTC 14:30 = 北京时间 22:30，每天自动触发一次
  workflow_dispatch:         # 允许在 Actions 页面手动点 Run workflow 立即执行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Inject config from Secrets and run monitor
      env:
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        LEETCODE_USERS_JSON: ${{ secrets.LEETCODE_USERS_JSON }}
      run: |
        python - <<'PY'
        import json, os
        with open('config.json', 'r', encoding='utf-8') as f:
            cfg = json.load(f)
        cfg['channels']['feishu']['webhook_url'] = os.environ['FEISHU_WEBHOOK_URL']
        sec = os.environ.get('FEISHU_SECRET', '')
        cfg['channels']['feishu']['secret'] = '' if sec in ('', 'NONE') else sec
        users_raw = os.environ.get('LEETCODE_USERS_JSON', '[]')
        if users_raw.strip():
            try:
                cfg['users'] = json.loads(users_raw)
            except Exception as e:
                print(f'[WARN] LEETCODE_USERS_JSON 解析失败: {e}，使用 config.json 原配置')
        with open('config.json', 'w', encoding='utf-8') as f:
            json.dump(cfg, f, ensure_ascii=False, indent=2)
        print('config.json 注入完成，当前 users:', [u.get('slug') for u in cfg.get('users', [])])
        PY
        python monitor.py
